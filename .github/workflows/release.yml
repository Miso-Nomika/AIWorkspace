# 배포: v로 시작하는 태그(예: v0.7.0)를 push하면 Windows·Linux 설치 파일을 빌드해 GitHub 릴리즈 초안에 첨부한다.
# - Windows: NSIS 설치 파일 (.exe)
# - Linux: .deb
# 캐시(npm·Rust)와 수동 실행용 아티팩트는 쓰지 않는다 — GitHub 저장소 용량·호출을 최소로 하려는 것이다 (빌드 시간은 길어진다).
# 릴리즈는 초안(draft)으로 만들어지므로 GitHub에서 내용을 확인한 뒤 직접 게시(Publish)한다.
# 태그의 버전과 package.json·src-tauri/tauri.conf.json·src-tauri/Cargo.toml의 version이 같아야 한다.
# 서명 파일(.sig)과 업데이트 정보(latest.json)도 함께 만들어 첨부한다 — 앱의 자동 업데이트가 이 파일을 읽는다 (저장소가 공개여야 함).
# 이 워크플로만 GitHub에서 돌린다 (Linux 설치 파일은 Windows PC에서 만들 수 없으므로).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 빌드 의존성 (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: 설치 파일 빌드 + 릴리즈 초안에 첨부
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트용 서명 (비밀 키는 저장소 시크릿에만 있다. 잃어버리면 이미 설치된 앱은 업데이트를 받을 수 없다)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "AIWorkspace ${{ github.ref_name }}"
          releaseBody: |
            ## 설치
            - **Windows**: `AIWorkspace_<버전>_x64-setup.exe`를 내려받아 실행하세요.
            - **Linux**: `.deb`(Ubuntu·Debian)를 내려받아 `sudo apt install ./파일.deb`로 설치하세요.
            - Claude Code CLI가 설치·로그인되어 있어야 합니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
